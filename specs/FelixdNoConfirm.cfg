\* A node fails the workload on its own clock. After a clock fault it does
\* so while another node holds the lease.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- One
    MaxEpoch = 2
    MaxCrashes = 0
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 0
    MaxRecreates = 0
    MaxInflight = 2
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = FALSE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = FALSE
    LocalFaults = TRUE
    TimingFaults = TRUE
    FaultsInFailWindow = FALSE
    RecreateWhenWritten = TRUE

SYMMETRY Symmetry

INVARIANT NoStaleFailure
