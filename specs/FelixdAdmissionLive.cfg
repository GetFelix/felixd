\* Liveness with no adversary: two projectors, one crash, three decisions that
\* may be rejected or stops. Every accepted request is acted on.

SPECIFICATION LiveSpec

CONSTANTS
    Projectors = {p1, p2}
    Nodes = {n1}
    SpecVals <- AStop
    MaxDecisions = 3
    MaxReserved = 0
    Rejections = TRUE
    ModuleFaults = FALSE
    MaxForges = 0
    MaxRepoints = 0
    MaxStarts = 3
    MaxCrashes = 1
    GateOnMarker = TRUE
    VerifiedOnly = TRUE
    LaterByDecision = TRUE
    RecordSkips = TRUE
    ReserveIds = TRUE
    CondWrite = TRUE
    FreshFold = TRUE

INVARIANT OnlyAdmittedRuns
INVARIANT NoRollback
INVARIANT SkippedStaysSkipped
INVARIANT ProjectedAtMostOnce
INVARIANT ReservedNeverViaIntake
PROPERTY LiveRuns
