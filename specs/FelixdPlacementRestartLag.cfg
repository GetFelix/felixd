    N = 2
    K = 2
    Cap = 2
    Bound = 1
    InitAdmitted = {1,2}
    MaxIn = 5
    MaxEpoch = 1
    MaxNodeCrash = 1
    CrashNodes = {1,2}
    CrashEpochs = {1}
    CrashPlaced = {FALSE, TRUE}
    MaxExpire = 0
    LapseLive = FALSE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE
    ForgetDown = TRUE
    ForgetRace = FALSE
    Blocking = FALSE
    MaxDrain = 0
    RecordHold = TRUE
    TailGate = TRUE

INVARIANT TypeOK
INVARIANT GroupWhole
INVARIANT GroupTogether
INVARIANT SplitNeverKept
INVARIANT ReplaySame
INVARIANT StaleNeverApplied
