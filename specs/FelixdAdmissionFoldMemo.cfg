\* A node keeps its verdict on a record it read, so a record naming a decision
\* past the tail stays unverified after the decision lands, and an older
\* record runs after the newer one did.

SPECIFICATION Spec

CONSTANTS
    Projectors = {p1}
    Nodes = {n1}
    SpecVals <- AStop
    MaxDecisions = 2
    MaxReserved = 0
    Rejections = FALSE
    ModuleFaults = FALSE
    MaxForges = 1
    MaxRepoints = 2
    MaxStarts = 1
    MaxCrashes = 0
    GateOnMarker = TRUE
    VerifiedOnly = TRUE
    LaterByDecision = TRUE
    RecordSkips = TRUE
    ReserveIds = TRUE
    CondWrite = TRUE
    FreshFold = FALSE

INVARIANT NoRollback
