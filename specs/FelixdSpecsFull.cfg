\* Everything at once: three nodes, an edit and then a module change, four
\* claims, a needs-operator record and two inputs. Too large to check
\* exhaustively; the nightly TLA job runs it in simulation mode.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    Lineage <- EditThenModule
    MaxClaims = 4
    MaxNops = 1
    MaxInputs = 2
    FloorCarry = TRUE
    RetryFloor = TRUE
    NopFloor = TRUE
    SkipNopFirst = TRUE
    HistoryGuard = TRUE
    PostCheck = TRUE
    CheckSkipNop = TRUE
    CheckNopFloor = TRUE
    CheckRefuse = TRUE
    CheckLineage = TRUE

SYMMETRY Symmetry

INVARIANT OutputLineage
INVARIANT FloorMonotone
INVARIANT RanMonotone
INVARIANT NoRunBelowFloor
INVARIANT CheckMatchesRun
