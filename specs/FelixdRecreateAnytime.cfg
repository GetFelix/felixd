\* The epochs cache is recreated while a holder has not written its epoch
\* anywhere. The next claim gets the same epoch. This is the one assumption
\* design.md states for epochs.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- One
    MaxEpoch = 3
    MaxCrashes = 0
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 0
    MaxRecreates = 1
    MaxInflight = 2
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    LocalFaults = FALSE
    TimingFaults = TRUE
    FaultsInFailWindow = FALSE
    RecreateWhenWritten = FALSE

SYMMETRY Symmetry

INVARIANT UniqueEpoch
