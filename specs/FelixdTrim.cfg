\* Trimming: an input with one output, then an idle one, two claims, a crash, a
\* clock fault and two snapshots, so a later holder can snapshot at a step below
\* an earlier holder's. One trim keeps the last snapshot. Expected to pass.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- OneThenIdle
    MaxEpoch = 2
    MaxCrashes = 1
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 2
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 0
    MaxTrims = 1
    Keep = 1
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = TRUE
    IndexFold = TRUE
    LocalFaults = FALSE
    TimingFaults = TRUE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE
    TrimOwnSnap = TRUE
    TrimLowestStep = TRUE

SYMMETRY Symmetry

INVARIANT RestoreIntact
INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT SnapshotsSplit
