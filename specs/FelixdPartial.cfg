\* An input with no output, then one with two, whose batch may land in part:
\* the owner gets an error with a prefix on the stream, or crashes and the
\* next owner resumes in the middle of the step. Expected to pass.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- IdleThenTwo
    MaxEpoch = 2
    MaxCrashes = 1
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 1
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 1
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = TRUE
    IndexFold = TRUE
    LocalFaults = TRUE
    TimingFaults = TRUE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE

SYMMETRY Symmetry

INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT NoStaleFailure
INVARIANT NoPoison
INVARIANT UniqueEpoch
INVARIANT SnapshotsSplit
