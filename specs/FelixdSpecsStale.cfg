\* Spec history with an edit and then an input change: three nodes, three
\* claims and one input, so two stale nodes can claim after a later spec.
\* Expected to pass.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    Lineage <- EditThenInput
    MaxClaims = 3
    MaxNops = 0
    MaxInputs = 1
    FloorCarry = TRUE
    RetryFloor = TRUE
    NopFloor = TRUE
    SkipNopFirst = TRUE
    HistoryGuard = TRUE
    PostCheck = TRUE
    CheckSkipNop = TRUE
    CheckNopFloor = TRUE
    CheckRefuse = TRUE
    CheckLineage = TRUE

SYMMETRY Symmetry

INVARIANT OutputLineage
INVARIANT FloorMonotone
INVARIANT RanMonotone
INVARIANT NoRunBelowFloor
INVARIANT CheckMatchesRun
