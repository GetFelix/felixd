\* Everything at once. Too large to check exhaustively; the nightly TLA
\* job runs it in simulation mode.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- TwoEach
    MaxBegins = 4
    MaxCrashes = 2
    MaxLost = 2
    MaxPartials = 1
    MaxRecreates = 1
    PerWrite = 2
    MergeClaim = TRUE
    ClaimCheck = TRUE
    OutFirst = TRUE
    CatchUp = TRUE
    SameEpochSkip = TRUE
    SameBytes = TRUE

SYMMETRY Symmetry

INVARIANT MergeExact MergeEpochMonotone EntriesClaimed OutputsFenced OneWriter OutputsFollowMerge StepsFollowMerge
