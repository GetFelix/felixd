\* No merge claim. A stale holder appends after the new holder has read
\* the tail it resumes from.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- OneEach
    MaxBegins = 2
    MaxCrashes = 0
    MaxLost = 0
    MaxPartials = 0
    MaxRecreates = 0
    PerWrite = 1
    MergeClaim = FALSE
    ClaimCheck = TRUE
    OutFirst = TRUE
    CatchUp = TRUE
    SameEpochSkip = TRUE

SYMMETRY Symmetry

INVARIANT MergeEpochMonotone
