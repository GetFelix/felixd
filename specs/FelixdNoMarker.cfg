\* No claim record. A stale owner's append that was in flight lands after
\* the new owner has resumed, because the new owner has not written yet.
\* This is today's fence (design.md, Exactly-once output).

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- One
    MaxEpoch = 2
    MaxCrashes = 0
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 0
    MaxRecreates = 0
    MaxInflight = 2
    ClaimMarker = FALSE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    LocalFaults = TRUE
    TimingFaults = TRUE
    FaultsInFailWindow = FALSE
    RecreateWhenWritten = TRUE

SYMMETRY Symmetry

INVARIANT NoInterleave
