\* Two projectors that crash and race, two decisions that may be rejected or
\* stops, one forged record and two repoints of `workloads`. Expected to pass.

SPECIFICATION Spec

CONSTANTS
    Projectors = {p1, p2}
    Nodes = {n1}
    SpecVals <- AStop
    MaxDecisions = 2
    MaxReserved = 0
    Rejections = TRUE
    ModuleFaults = FALSE
    MaxForges = 1
    MaxRepoints = 2
    MaxStarts = 3
    MaxCrashes = 1
    GateOnMarker = TRUE
    VerifiedOnly = TRUE
    LaterByDecision = TRUE
    RecordSkips = TRUE
    ReserveIds = TRUE
    CondWrite = TRUE
    FreshFold = TRUE

SYMMETRY Symmetry

INVARIANT OnlyAdmittedRuns
INVARIANT NoRollback
INVARIANT SkippedStaysSkipped
INVARIANT ProjectedAtMostOnce
INVARIANT ReservedNeverViaIntake
