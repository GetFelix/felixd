\* A generation-start record on either stream, a clock fault and a snapshot,
\* over two claims. Expected to pass.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- One
    MaxEpoch = 2
    MaxCrashes = 0
    MaxClockFaults = 1
    MaxGens = 1
    MaxSnaps = 1
    MaxRecreates = 0
    MaxInflight = 2
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    LocalFaults = TRUE
    TimingFaults = TRUE
    FaultsInFailWindow = FALSE
    RecreateWhenWritten = TRUE

SYMMETRY Symmetry

INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT NoStaleFailure
INVARIANT NoPoison
INVARIANT UniqueEpoch
INVARIANT SnapshotsSplit
