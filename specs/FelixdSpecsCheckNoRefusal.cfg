\* felixd check counts a claim below the floor before it.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Lineage <- EditThenModule
    MaxClaims = 2
    MaxNops = 1
    MaxInputs = 2
    FloorCarry = TRUE
    RetryFloor = TRUE
    NopFloor = TRUE
    SkipNopFirst = TRUE
    HistoryGuard = TRUE
    PostCheck = TRUE
    CheckSkipNop = TRUE
    CheckNopFloor = TRUE
    CheckRefuse = FALSE
    CheckLineage = TRUE

SYMMETRY Symmetry

INVARIANT CheckMatchesRun
