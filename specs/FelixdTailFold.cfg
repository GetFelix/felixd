\* The resume fold before #67, which compared the raw tail with the
\* snapshot's. A claim record, like a generation-start record, takes an
\* offset, so the fold fails a healthy workload.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- One
    MaxEpoch = 1
    MaxCrashes = 0
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 0
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 0
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = FALSE
    FailRecord = TRUE
    IndexFold = TRUE
    LocalFaults = FALSE
    TimingFaults = FALSE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE

SYMMETRY Symmetry

INVARIANT NoPoison
