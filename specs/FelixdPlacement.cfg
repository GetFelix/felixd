\* Two nodes, a group of two, a scheduler takeover with replay and a node
\* crash. Expected to pass. FelixdPlacementLease has a lease lost by a live
\* holder instead, FelixdPlacementCrashLease both. Too slow for one CI leg,
\* so CI checks it as the eight FelixdPlacementCrashN*E* configs, which split
\* it by which node crashes, in which epoch, and before or after the first
\* group record.

SPECIFICATION Spec

CONSTANTS
    N = 2
    K = 2
    Cap = 2
    Bound = 1
    InitAdmitted = {1,2}
    MaxIn = 5
    MaxEpoch = 2
    MaxNodeCrash = 1
    CrashNodes = {1,2}
    CrashEpochs = {1,2}
    CrashPlaced = {FALSE, TRUE}
    MaxExpire = 0
    LapseLive = FALSE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE
    ForgetDown = FALSE
    ForgetRace = FALSE
    Blocking = FALSE
    MaxDrain = 0
    Undrain = FALSE
    UndrainRace = FALSE
    Stamps = {}
    RecordHold = TRUE
    TailGate = TRUE

INVARIANT TypeOK
INVARIANT GroupWhole
INVARIANT GroupTogether
INVARIANT SplitNeverKept
INVARIANT ReplaySame
INVARIANT StaleNeverApplied
