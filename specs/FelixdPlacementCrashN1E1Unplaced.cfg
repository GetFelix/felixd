\* The part of FelixdPlacement where node 1 crashes in scheduler epoch 1,
\* before any group record is on `out`, plus every run with no crash. The eight
\* FelixdPlacementCrashN*E* configs together are FelixdPlacement. Expected to pass.

SPECIFICATION Spec

CONSTANTS
    N = 2
    K = 2
    Cap = 2
    Bound = 1
    InitAdmitted = {1,2}
    MaxIn = 5
    MaxEpoch = 2
    MaxNodeCrash = 1
    CrashNodes = {1}
    CrashEpochs = {1}
    CrashPlaced = {FALSE}
    MaxExpire = 0
    LapseLive = FALSE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE
    ForgetDown = FALSE
    ForgetRace = FALSE
    Blocking = FALSE
    MaxDrain = 0
    RecordHold = TRUE
    TailGate = TRUE

INVARIANT TypeOK
INVARIANT GroupWhole
INVARIANT GroupTogether
INVARIANT SplitNeverKept
INVARIANT ReplaySame
INVARIANT StaleNeverApplied
