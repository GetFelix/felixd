\* A live node judged silent by `sys.facts` time keeps the member it holds,
\* while the scheduler moves the group to another node that claims the
\* rest: the group runs split before the bound. A known gap, felixd #247.

SPECIFICATION Spec

CONSTANTS
    N = 2
    K = 2
    Cap = 2
    Bound = 1
    InitAdmitted = {1,2}
    MaxIn = 5
    MaxEpoch = 1
    MaxNodeCrash = 0
    MaxExpire = 0
    LapseLive = TRUE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE

INVARIANT GroupTogether
