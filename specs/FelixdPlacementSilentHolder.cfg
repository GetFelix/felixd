    K = 2
    Cap = 2
    Bound = 1
    InitAdmitted = {1,2}
    MaxIn = 5
    MaxEpoch = 1
    MaxNodeCrash = 0
    CrashNodes = {1,2}
    CrashEpochs = {1}
    CrashPlaced = {FALSE, TRUE}
    MaxExpire = 0
    LapseLive = TRUE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE
    ForgetDown = FALSE
    ForgetRace = FALSE
    Blocking = TRUE
    MaxDrain = 1
    DrainNodes = {1,2}
    DrainPlaced = {FALSE, TRUE}
    Undrain = FALSE
    UndrainRace = FALSE
    RelistRace = FALSE
    Stamps = {}
    RecordHold = TRUE
    TailGate = TRUE

INVARIANT TypeOK
INVARIANT GroupWhole
INVARIANT GroupTogether
INVARIANT SplitNeverKept
INVARIANT ReplaySame
