\* Liveness: no local deadlines or clock faults, one crash, one
\* generation-start record. A free workload is claimed, and every output is
\* written.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- One
    MaxEpoch = 2
    MaxCrashes = 1
    MaxClockFaults = 0
    MaxGens = 1
    MaxSnaps = 1
    MaxRecreates = 0
    MaxInflight = 2
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    LocalFaults = FALSE
    TimingFaults = FALSE
    FaultsInFailWindow = FALSE
    RecreateWhenWritten = TRUE

INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT NoStaleFailure
INVARIANT NoPoison
INVARIANT UniqueEpoch
INVARIANT SnapshotsSplit
PROPERTY FreeIsClaimed
PROPERTY EventuallyDone
