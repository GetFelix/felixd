\* A clock fault between an applied confirm and the failure write, the
\* window PR #68 names. The failure record fences the write by epoch (#70),
\* so it passes.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- One
    MaxEpoch = 2
    MaxCrashes = 0
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 0
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 0
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = TRUE
    IndexFold = TRUE
    LocalFaults = TRUE
    TimingFaults = TRUE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE

SYMMETRY Symmetry

INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT NoStaleFailure
INVARIANT NoPoison
INVARIANT UniqueEpoch
