\* Spec history with an edit and then a module change: two nodes, three
\* claims, a needs-operator record and two inputs. Expected to pass.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Lineage <- EditThenModule
    MaxClaims = 3
    MaxNops = 1
    MaxInputs = 2
    FloorCarry = TRUE
    RetryFloor = TRUE
    NopFloor = TRUE
    SkipNopFirst = TRUE
    HistoryGuard = TRUE
    PostCheck = TRUE
    CheckSkipNop = TRUE
    CheckNopFloor = TRUE
    CheckRefuse = TRUE
    CheckLineage = TRUE

SYMMETRY Symmetry

INVARIANT OutputLineage
INVARIANT FloorMonotone
INVARIANT RanMonotone
INVARIANT NoRunBelowFloor
INVARIANT CheckMatchesRun
