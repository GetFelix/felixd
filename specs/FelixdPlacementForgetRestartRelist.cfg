    CrashNodes = {1,2}
    CrashEpochs = {1}
    CrashPlaced = {FALSE, TRUE}
    MaxExpire = 0
    LapseLive = FALSE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE
    ForgetDown = TRUE
    ForgetRace = TRUE
    Blocking = FALSE
    MaxDrain = 0
    DrainNodes = {1,2}
    DrainPlaced = {FALSE, TRUE}
    Undrain = FALSE
    UndrainRace = FALSE
    RelistRace = FALSE
    Stamps = {}
    RecordHold = TRUE
    TailGate = TRUE
    StartRelist = TRUE
    ForgetLive = FALSE
    SelfFence = TRUE
    StopPause = FALSE

INVARIANT GroupTogether
INVARIANT TypeOK
