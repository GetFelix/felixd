\* Everything at once: two inputs (the second a batch of two that may land in
\* part), three claims, a crash, a clock fault, a generation-start record and
\* a snapshot. Too large to check exhaustively;
\* the nightly TLA job runs it in simulation mode.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- OneThenTwo
    MaxEpoch = 3
    MaxCrashes = 1
    MaxClockFaults = 1
    MaxGens = 1
    MaxSnaps = 1
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 1
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = TRUE
    IndexFold = TRUE
    LocalFaults = TRUE
    TimingFaults = TRUE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE

SYMMETRY Symmetry

INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT NoStaleFailure
INVARIANT NoPoison
INVARIANT UniqueEpoch
INVARIANT SnapshotsSplit
