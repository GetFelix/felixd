\* Reconcile takes any record of its own epoch past the tail as the entry it
\* sent. A holder whose append timed out ends the run, merges another record
\* at the same tail, and the old append lands first: the holder steps the
\* new record at the old one's offset.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- OneEach
    MaxBegins = 1
    MaxCrashes = 0
    MaxLost = 1
    MaxPartials = 0
    MaxRecreates = 0
    PerWrite = 1
    MergeClaim = TRUE
    ClaimCheck = TRUE
    OutFirst = TRUE
    CatchUp = TRUE
    SameEpochSkip = TRUE
    SameBytes = FALSE

SYMMETRY Symmetry

INVARIANT StepsFollowMerge
