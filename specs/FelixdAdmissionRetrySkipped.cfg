\* No skip records: a projector keeps only the latest recorded decision per
\* workload and walks the decisions from the first, so a new one records a
\* decision an earlier one passed over once its module is uploaded.

SPECIFICATION Spec

CONSTANTS
    Projectors = {p1, p2}
    Nodes = {n1}
    SpecVals <- AStop
    MaxDecisions = 1
    MaxReserved = 0
    Rejections = FALSE
    ModuleFaults = TRUE
    MaxForges = 0
    MaxRepoints = 0
    MaxStarts = 2
    MaxCrashes = 0
    GateOnMarker = TRUE
    VerifiedOnly = TRUE
    LaterByDecision = TRUE
    RecordSkips = FALSE
    ReserveIds = TRUE
    CondWrite = TRUE
    FreshFold = TRUE

SYMMETRY Symmetry

INVARIANT SkippedStaysSkipped
