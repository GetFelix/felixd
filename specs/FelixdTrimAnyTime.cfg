\* The same as FelixdTrim with a trim allowed at any time, not only right after
\* the ack of the holder's snapshot. Expected to violate RestoreIntact: a snapshot
\* write the holder gave up on lands after a trim set from a newer one.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- OneThenIdle
    MaxEpoch = 2
    MaxCrashes = 1
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 2
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 0
    MaxTrims = 1
    Keep = 1
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = TRUE
    IndexFold = TRUE
    LocalFaults = FALSE
    TimingFaults = TRUE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE
    TrimOwnSnap = TRUE
    TrimLowestStep = TRUE
    TrimAnyTime = TRUE

SYMMETRY Symmetry

INVARIANT RestoreIntact
INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT SnapshotsSplit
