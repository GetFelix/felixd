\* The floors come from the oldest kept record's step, not the lowest step among
\* the kept snapshots. The newest snapshot is at a lower step, so the merge log
\* and inputs it reads are deleted.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- OneEach
    MaxBegins = 2
    MaxCrashes = 0
    MaxLost = 0
    MaxPartials = 0
    MaxRecreates = 0
    PerWrite = 2
    Quiet <- SecondQuiet
    MaxSnaps = 2
    MaxTrims = 1
    Keep = 2
    MergeClaim = TRUE
    ClaimCheck = TRUE
    OutFirst = TRUE
    CatchUp = TRUE
    SameEpochSkip = TRUE
    SameBytes = TRUE
    TrimLowestStep = FALSE

SYMMETRY Symmetry

INVARIANT RestoreIntact MergeExact MergeEpochMonotone EntriesClaimed OutputsFenced OneWriter OutputsFollowMerge StepsFollowMerge
