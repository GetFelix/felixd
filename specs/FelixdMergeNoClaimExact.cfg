\* No merge claim, with a crash and a lost answer. Expected to pass: without
\* the claim, reconcile still keeps the log and the outputs exact.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- OneEach
    MaxBegins = 2
    MaxCrashes = 1
    MaxLost = 1
    MaxPartials = 0
    MaxRecreates = 0
    PerWrite = 2
    MergeClaim = FALSE
    ClaimCheck = TRUE
    OutFirst = TRUE
    CatchUp = TRUE
    SameEpochSkip = TRUE
    SameBytes = TRUE

SYMMETRY Symmetry

INVARIANT MergeExact
INVARIANT OneWriter
INVARIANT OutputsFollowMerge
INVARIANT StepsFollowMerge
