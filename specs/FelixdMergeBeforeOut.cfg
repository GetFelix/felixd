\* The merge log claimed before `.out`. A holder that crashed in between
\* leaves an epoch on the merge log the epoch floor does not read, and once
\* `epochs` is recreated the next holder takes that epoch again.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- OneEach
    MaxBegins = 2
    MaxCrashes = 1
    MaxLost = 0
    MaxPartials = 0
    MaxRecreates = 1
    PerWrite = 1
    MergeClaim = TRUE
    ClaimCheck = TRUE
    OutFirst = FALSE
    CatchUp = TRUE
    SameEpochSkip = TRUE

SYMMETRY Symmetry

INVARIANT OneWriter
