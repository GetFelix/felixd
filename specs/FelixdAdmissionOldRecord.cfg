\* A record is superseded by a later record, not a later decision: a record of
\* an older decision that lands after a newer one runs.

SPECIFICATION Spec

CONSTANTS
    Projectors = {p1, p2}
    Nodes = {n1}
    SpecVals <- AStop
    MaxDecisions = 2
    MaxReserved = 0
    Rejections = FALSE
    ModuleFaults = FALSE
    MaxForges = 1
    MaxRepoints = 1
    MaxStarts = 2
    MaxCrashes = 0
    GateOnMarker = TRUE
    VerifiedOnly = TRUE
    LaterByDecision = FALSE
    RecordSkips = TRUE
    ReserveIds = TRUE
    CondWrite = TRUE
    FreshFold = TRUE

SYMMETRY Symmetry

INVARIANT NoRollback
