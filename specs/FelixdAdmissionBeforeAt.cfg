\* The gate reads only the records before the one `workloads` points at, and
\* is on only if admission's record is among them: a record written before
\* admission runs.

SPECIFICATION Spec

CONSTANTS
    Projectors = {p1}
    Nodes = {n1}
    SpecVals <- AStop
    MaxDecisions = 1
    MaxReserved = 0
    Rejections = FALSE
    ModuleFaults = FALSE
    MaxForges = 0
    MaxRepoints = 1
    MaxStarts = 1
    MaxCrashes = 0
    GateOnMarker = FALSE
    VerifiedOnly = TRUE
    LaterByDecision = TRUE
    RecordSkips = TRUE
    ReserveIds = TRUE
    CondWrite = TRUE
    FreshFold = TRUE

INVARIANT OnlyAdmittedRuns
