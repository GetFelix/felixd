\* Needs-operator records do not count toward the floor (#127, defect 2):
\* a stale node claims after a later spec's record and runs over it.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Lineage <- EditThenModule
    MaxClaims = 2
    MaxNops = 1
    MaxInputs = 2
    FloorCarry = TRUE
    RetryFloor = TRUE
    NopFloor = FALSE
    SkipNopFirst = TRUE
    HistoryGuard = TRUE
    PostCheck = TRUE
    CheckSkipNop = TRUE
    CheckNopFloor = TRUE
    CheckRefuse = TRUE
    CheckLineage = TRUE

SYMMETRY Symmetry

INVARIANT NoRunBelowFloor
