    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- OneEach
    MaxBegins = 2
    MaxCrashes = 0
    MaxLost = 0
    MaxPartials = 0
    MaxRecreates = 0
    PerWrite = 1
    Quiet <- NoQuiet
    MaxSnaps = 0
    MaxTrims = 0
    Keep = 1
    MergeClaim = FALSE
    ClaimCheck = TRUE
    OutFirst = TRUE
    CatchUp = TRUE
    SameEpochSkip = TRUE
    SameBytes = TRUE
    TrimLowestStep = TRUE

SYMMETRY Symmetry

INVARIANT MergeEpochMonotone
