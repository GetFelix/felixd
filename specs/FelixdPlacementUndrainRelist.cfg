\* FelixdPlacementUndrain where the undrained node claims before the
\* scheduler folds a fact of it that is not draining: the scheduler moves
\* the group on its draining fact and it runs split before the bound.
\* A known gap, felixd #257.

SPECIFICATION Spec

CONSTANTS
    N = 2
    K = 2
    Cap = 2
    Bound = 1
    InitAdmitted = {1,2}
    MaxIn = 6
    MaxEpoch = 1
    MaxNodeCrash = 0
    CrashNodes = {1,2}
    CrashEpochs = {1}
    CrashPlaced = {FALSE, TRUE}
    MaxExpire = 0
    LapseLive = FALSE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE
    ForgetDown = FALSE
    ForgetRace = FALSE
    Blocking = FALSE
    MaxDrain = 1
    DrainNodes = {1,2}
    DrainPlaced = {FALSE, TRUE}
    Undrain = TRUE
    UndrainRace = FALSE
    RelistRace = TRUE
    Stamps = {}
    RecordHold = TRUE
    TailGate = TRUE
    StartRelist = FALSE
    ForgetLive = FALSE
    SelfFence = TRUE
    StopPause = FALSE

INVARIANT GroupTogether
