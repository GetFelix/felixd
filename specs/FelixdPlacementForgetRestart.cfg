\* A forgotten node restarts and claims on the record in force while it
\* still names the node, and the scheduler, which has forgotten it, moves the
\* group: it runs split before the bound. A known gap, felixd #251.

SPECIFICATION Spec

CONSTANTS
    N = 2
    K = 2
    Cap = 2
    Bound = 1
    InitAdmitted = {1,2}
    MaxIn = 5
    MaxEpoch = 1
    MaxNodeCrash = 1
    CrashNodes = {1,2}
    CrashEpochs = {1}
    CrashPlaced = {FALSE, TRUE}
    MaxExpire = 0
    LapseLive = FALSE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE
    ForgetDown = TRUE
    ForgetRace = TRUE
    Blocking = FALSE
    MaxDrain = 0
    Undrain = FALSE
    UndrainRace = FALSE
    Stamps = {}
    RecordHold = TRUE
    TailGate = TRUE

INVARIANT GroupTogether
