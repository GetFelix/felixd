\* A forgotten node restarts and claims on the record in force before the
\* scheduler folds its forget, which moves the group: it runs split before
\* the bound. A known gap, felixd #FORGET.

SPECIFICATION Spec

CONSTANTS
    N = 2
    K = 2
    Cap = 2
    Bound = 1
    InitAdmitted = {1,2}
    MaxIn = 5
    MaxEpoch = 1
    MaxNodeCrash = 1
    MaxExpire = 0
    LapseLive = FALSE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE
    ForgetDown = TRUE
    ForgetRace = TRUE
    Blocking = FALSE
    MaxDrain = 0
    RecordHold = TRUE
    TailGate = TRUE

INVARIANT GroupTogether
