\* felixd check takes the first record as the first claim. A stream that
\* starts with a needs-operator record is judged under the workloads value.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Lineage <- EditThenModule
    MaxClaims = 2
    MaxNops = 1
    MaxInputs = 2
    FloorCarry = TRUE
    RetryFloor = TRUE
    NopFloor = TRUE
    SkipNopFirst = TRUE
    HistoryGuard = TRUE
    PostCheck = TRUE
    CheckSkipNop = FALSE
    CheckNopFloor = TRUE
    CheckRefuse = TRUE
    CheckLineage = TRUE

SYMMETRY Symmetry

INVARIANT CheckMatchesRun
