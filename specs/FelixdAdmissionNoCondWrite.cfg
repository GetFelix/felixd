\* Projections are plain appends: two projectors record the same decision.

SPECIFICATION Spec

CONSTANTS
    Projectors = {p1, p2}
    Nodes = {n1}
    SpecVals <- AStop
    MaxDecisions = 1
    MaxReserved = 0
    Rejections = FALSE
    ModuleFaults = FALSE
    MaxForges = 0
    MaxRepoints = 0
    MaxStarts = 2
    MaxCrashes = 0
    GateOnMarker = TRUE
    VerifiedOnly = TRUE
    LaterByDecision = TRUE
    RecordSkips = TRUE
    ReserveIds = TRUE
    CondWrite = FALSE
    FreshFold = TRUE

SYMMETRY Symmetry

INVARIANT ProjectedAtMostOnce
