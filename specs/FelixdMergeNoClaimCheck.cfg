\* The merge claim does not check the last record. A holder frozen after
\* its `.out` claim claims the merge log after a later holder.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- OneEach
    MaxBegins = 2
    MaxCrashes = 0
    MaxLost = 0
    MaxPartials = 0
    MaxRecreates = 0
    PerWrite = 1
    MergeClaim = TRUE
    ClaimCheck = FALSE
    OutFirst = TRUE
    CatchUp = TRUE
    SameEpochSkip = TRUE

SYMMETRY Symmetry

INVARIANT MergeEpochMonotone
