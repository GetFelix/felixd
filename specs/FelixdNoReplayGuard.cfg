\* Snapshots while still replaying outputs already written. The snapshot
\* claims outputs it does not cover, and the next owner writes them again.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- OneEach
    MaxEpoch = 3
    MaxCrashes = 0
    MaxClockFaults = 0
    MaxGens = 0
    MaxSnaps = 1
    MaxRecreates = 0
    MaxInflight = 2
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = FALSE
    FoldOnEvents = TRUE
    LocalFaults = FALSE
    TimingFaults = TRUE
    FaultsInFailWindow = FALSE
    RecreateWhenWritten = TRUE

SYMMETRY Symmetry

INVARIANT OutputsExact
