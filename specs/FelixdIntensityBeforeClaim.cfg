\* The holder counts the tail read before its marker, plus its own claim. A claim that lands
\* before a retried marker goes uncounted, so it can run past the limit.
\* Expected to violate NoRunPastLimit.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- One
    MaxEpoch = 2
    MaxCrashes = 1
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 0
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 0
    MaxTrims = 0
    Keep = 1
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = TRUE
    IndexFold = TRUE
    LocalFaults = FALSE
    TimingFaults = TRUE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE
    TrimOwnSnap = TRUE
    TrimLowestStep = TRUE
    TrimAnyTime = FALSE
    Intensity = TRUE
    MaxTakeovers = 0
    Window = 0
    MaxTime = 2
    CountAfterClaim = FALSE
    NopFenced = TRUE

SYMMETRY Symmetry

INVARIANT NoRunPastLimit
