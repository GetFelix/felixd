\* Every record naming a decision counts as a later decision, verified or not:
\* a forged one blocks the latest admitted record.

SPECIFICATION Spec

CONSTANTS
    Projectors = {p1}
    Nodes = {n1}
    SpecVals <- AStop
    MaxDecisions = 1
    MaxReserved = 0
    Rejections = FALSE
    ModuleFaults = FALSE
    MaxForges = 1
    MaxRepoints = 0
    MaxStarts = 1
    MaxCrashes = 0
    GateOnMarker = TRUE
    VerifiedOnly = FALSE
    LaterByDecision = TRUE
    RecordSkips = TRUE
    ReserveIds = TRUE
    CondWrite = TRUE
    FreshFold = TRUE

INVARIANT OnlyAdmittedRuns
