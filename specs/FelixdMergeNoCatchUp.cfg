\* The entries before the claim are not stepped. A holder that crashed
\* between its merge append and its steps leaves a gap in the outputs.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- OneEach
    MaxBegins = 2
    MaxCrashes = 1
    MaxLost = 0
    MaxPartials = 0
    MaxRecreates = 0
    PerWrite = 1
    MergeClaim = TRUE
    ClaimCheck = TRUE
    OutFirst = TRUE
    CatchUp = FALSE
    SameEpochSkip = TRUE
    SameBytes = TRUE

SYMMETRY Symmetry

INVARIANT OutputsFollowMerge
