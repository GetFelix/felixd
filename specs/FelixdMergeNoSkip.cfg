\* A holder claims the merge log again over its own claim. Expected to
\* pass: the skip saves a record, it is not a guard.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- OneEach
    MaxBegins = 2
    MaxCrashes = 1
    MaxLost = 1
    MaxPartials = 0
    MaxRecreates = 0
    PerWrite = 2
    Quiet <- NoQuiet
    MaxSnaps = 0
    MaxTrims = 0
    Keep = 1
    MergeClaim = TRUE
    ClaimCheck = TRUE
    OutFirst = TRUE
    CatchUp = TRUE
    SameEpochSkip = FALSE
    SameBytes = TRUE
    TrimLowestStep = TRUE

SYMMETRY Symmetry

INVARIANT MergeExact MergeEpochMonotone EntriesClaimed OutputsFenced OneWriter OutputsFollowMerge StepsFollowMerge
