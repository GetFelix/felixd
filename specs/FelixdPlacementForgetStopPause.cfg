\* FelixdPlacementForgetLive with the fence clock and facts held over a
\* scheduler stop, as before felixd #271: a node holding the group pauses,
\* another node's facts (a stale watch) forget it, and the scheduler moves
\* the group while it still runs the members.

SPECIFICATION Spec

CONSTANTS
    N = 2
    K = 2
    Cap = 2
    Bound = 1
    InitAdmitted = {1,2}
    MaxIn = 5
    MaxEpoch = 1
    MaxNodeCrash = 0
    CrashNodes = {1,2}
    CrashEpochs = {1}
    CrashPlaced = {FALSE, TRUE}
    MaxExpire = 0
    LapseLive = FALSE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE
    ForgetDown = TRUE
    ForgetRace = TRUE
    Blocking = FALSE
    MaxDrain = 0
    DrainNodes = {1,2}
    DrainPlaced = {FALSE, TRUE}
    Undrain = FALSE
    UndrainRace = FALSE
    RelistRace = FALSE
    Stamps = {}
    RecordHold = TRUE
    TailGate = TRUE
    StartRelist = TRUE
    ForgetLive = TRUE
    SelfFence = TRUE
    StopPause = TRUE

INVARIANT GroupTogether
