\* Trimming a merged workload: one record on each input, the second input's
\* record has no output, two holders, two snapshots, one trim keeping the last
\* snapshot. A later holder can snapshot at a step below an earlier holder's.
\* Expected to pass.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Ins <- OneEach
    MaxBegins = 2
    MaxCrashes = 0
    MaxLost = 0
    MaxPartials = 0
    MaxRecreates = 0
    PerWrite = 2
    Quiet <- SecondQuiet
    MaxSnaps = 2
    MaxTrims = 1
    Keep = 1
    MergeClaim = TRUE
    ClaimCheck = TRUE
    OutFirst = TRUE
    CatchUp = TRUE
    SameEpochSkip = TRUE
    SameBytes = TRUE
    TrimLowestStep = TRUE

SYMMETRY Symmetry

INVARIANT RestoreIntact MergeExact MergeEpochMonotone EntriesClaimed OutputsFenced OneWriter OutputsFollowMerge StepsFollowMerge
