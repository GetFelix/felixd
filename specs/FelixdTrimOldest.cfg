\* The input floor is the step of the oldest kept record, not the lowest step
\* among the kept snapshots. The newest snapshot, which a resume restores, is at
\* a lower step, so inputs it reads are deleted.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- OneThenIdle
    MaxEpoch = 2
    MaxCrashes = 0
    MaxClockFaults = 0
    MaxGens = 0
    MaxSnaps = 2
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 0
    MaxTrims = 1
    Keep = 2
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = TRUE
    IndexFold = TRUE
    LocalFaults = FALSE
    TimingFaults = TRUE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE
    TrimOwnSnap = TRUE
    TrimLowestStep = FALSE
    TrimAnyTime = FALSE

SYMMETRY Symmetry

INVARIANT RestoreIntact
INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT SnapshotsSplit
