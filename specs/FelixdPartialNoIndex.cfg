\* As FelixdPartial, with the fold skipping whole inputs rather than outputs
\* by index. A resume after a prefix drops the rest of the step, and the
\* skipped-output check finds the stream short. Expected to violate NoPoison.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- IdleThenTwo
    MaxEpoch = 2
    MaxCrashes = 1
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 1
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 1
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = TRUE
    IndexFold = FALSE
    LocalFaults = TRUE
    TimingFaults = TRUE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE

SYMMETRY Symmetry

INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT NoStaleFailure
INVARIANT NoPoison
INVARIANT UniqueEpoch
INVARIANT SnapshotsSplit
