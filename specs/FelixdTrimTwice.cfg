\* Two trims: an input with an output, an idle one and another with an output, so
\* the second trim raises floors the first set. Two holders and a crash. Expected to pass.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- OneIdleOne
    MaxEpoch = 2
    MaxCrashes = 1
    MaxClockFaults = 0
    MaxGens = 0
    MaxSnaps = 3
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 0
    MaxTrims = 2
    Keep = 1
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = TRUE
    IndexFold = TRUE
    LocalFaults = FALSE
    TimingFaults = TRUE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE
    TrimOwnSnap = TRUE
    TrimLowestStep = TRUE
    TrimAnyTime = FALSE

SYMMETRY Symmetry

INVARIANT RestoreIntact
INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT SnapshotsSplit
