\* An input with no output, then one with two, so a claim can find nothing
\* to write and batches hold two records. Expected to pass.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = NoNode
    Outs <- IdleThenTwo
    MaxEpoch = 2
    MaxCrashes = 0
    MaxClockFaults = 1
    MaxGens = 0
    MaxSnaps = 1
    MaxRecreates = 0
    MaxInflight = 2
    MaxPartials = 0
    ClaimMarker = TRUE
    EpochFloor = TRUE
    Confirmer = TRUE
    LaterEpochWins = TRUE
    ReplayGuard = TRUE
    FoldOnEvents = TRUE
    FailRecord = TRUE
    IndexFold = TRUE
    LocalFaults = TRUE
    TimingFaults = TRUE
    FaultsInFailWindow = TRUE
    RecreateWhenWritten = TRUE

SYMMETRY Symmetry

INVARIANT OutputsExact
INVARIANT EpochMonotone
INVARIANT NoInterleave
INVARIANT NoStaleFailure
INVARIANT NoPoison
INVARIANT UniqueEpoch
INVARIANT SnapshotsSplit
