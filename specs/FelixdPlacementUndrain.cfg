\* Unsplit reference for the four FelixdPlacementUndrainN* parts and the base of the
\* two twins; too long for one CI leg, so it is not in the matrix.
\* A drain lifted by `felixd undrain`. Timestamps are strictly increasing
\* here; the stamps legs cover ties. The undrained node claims nothing until
\* the scheduler has folded a fact of it that is not draining and its view
\* of `out` holds every record written up to that fold; the code does
\* neither yet (felixd #256, #257). Expected to pass.

SPECIFICATION Spec

CONSTANTS
    N = 2
    K = 2
    Cap = 2
    Bound = 1
    InitAdmitted = {1,2}
    MaxIn = 6
    MaxEpoch = 1
    MaxNodeCrash = 0
    CrashNodes = {1,2}
    CrashEpochs = {1}
    CrashPlaced = {FALSE, TRUE}
    MaxExpire = 0
    LapseLive = FALSE
    Barrier = TRUE
    SplitGuard = TRUE
    OneRecord = TRUE
    Fence = TRUE
    FactTakers = TRUE
    ForgetDown = FALSE
    ForgetRace = FALSE
    Blocking = FALSE
    MaxDrain = 1
    DrainNodes = {1,2}
    DrainPlaced = {FALSE, TRUE}
    Undrain = TRUE
    UndrainRace = FALSE
    RelistRace = FALSE
    Stamps = {}
    RecordHold = TRUE
    TailGate = TRUE
    StartRelist = FALSE
    ForgetLive = FALSE
    SelfFence = TRUE

INVARIANT TypeOK
INVARIANT GroupWhole
INVARIANT GroupTogether
INVARIANT SplitNeverKept
INVARIANT ReplaySame
INVARIANT StaleNeverApplied
