\* A refused claim does not raise its floor from the records past the
\* tail, so it lands after a later spec's claim with a lower floor.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Lineage <- EditThenModule
    MaxClaims = 2
    MaxNops = 1
    MaxInputs = 2
    FloorCarry = TRUE
    RetryFloor = FALSE
    NopFloor = TRUE
    SkipNopFirst = TRUE
    HistoryGuard = TRUE
    PostCheck = TRUE
    CheckSkipNop = TRUE
    CheckNopFloor = TRUE
    CheckRefuse = TRUE
    CheckLineage = TRUE

SYMMETRY Symmetry

INVARIANT FloorMonotone
