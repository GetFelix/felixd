[workspace]
resolver = "3"
members = ["crates/core", "crates/runtime", "crates/agent", "crates/felixd"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/GetFelix/felixd"
publish = false

[workspace.dependencies]
felixd-core = { path = "crates/core" }
felixd-runtime = { path = "crates/runtime" }
felixd-agent = { path = "crates/agent" }
clap = { version = "=4.5.48", features = ["derive"] }

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
mod_module_files = "warn"
