[workspace]
resolver = "3"
members = ["crates/core", "crates/runtime", "crates/agent", "crates/felixd", "crates/testkit"]
exclude = ["workloads"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/GetFelix/felixd"
publish = false

[workspace.dependencies]
felixd-core = { path = "crates/core" }
felixd-runtime = { path = "crates/runtime" }
felixd-agent = { path = "crates/agent" }
felixd-testkit = { path = "crates/testkit" }
wasmtime = { version = "=50.0.0", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wit-component = "=0.262.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
wat = "=1.262.0"
clap = { version = "=4.5.48", features = ["derive"] }

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
mod_module_files = "warn"
