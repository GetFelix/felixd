# Three Felix brokers, a control plane and three felixd nodes, for trying
# failover. Adapted from tests/felix/cluster.yaml.
#
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml run --rm felixd run --id counter \
#     --input in --replication-factor 3 /usr/local/share/felixd/counter.wasm
#
# With Podman, use the docker-compose provider (2.20 or later):
#
#   PODMAN_COMPOSE_PROVIDER=docker-compose podman compose -f deploy/compose.yaml up -d --build
#
# FELIX_VERSION overrides the Felix image tag. Run `docker compose down -v`
# before `up` again: the control plane keeps its metadata in memory but the
# brokers keep their data in the felix-dev volume.
#
# DEVELOPMENT ONLY. The credentials are fixed, minted without an identity
# provider, and live for a day. Nothing is published on the host, and brokers
# talk to each other without mTLS on a private network.

name: felixd

x-broker: &broker
  image: ghcr.io/getfelix/felix-broker:${FELIX_VERSION:-0.6.2}
  depends_on:
    felix-dev-auth:
      condition: service_completed_successfully
  volumes:
    - felix-dev:/var/lib/felix
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
    interval: 2s
    timeout: 2s
    retries: 60

x-broker-env: &broker-env
  FELIX_CONTROLPLANE_URL: http://felix-controlplane:8443
  FELIX_QUIC_BIND: 0.0.0.0:5000
  FELIX_QUIC_LISTENERS: "1"
  FELIX_INTERNAL_BIND: 0.0.0.0:5001
  # Peers reach the internal port only on this compose network.
  FELIX_INTERNAL_ALLOW_UNAUTHENTICATED: "true"
  FELIX_CONTROLPLANE_SYNC_INTERVAL_MS: "1000"
  FELIX_TLS_CERT: /var/lib/felix/broker-cert.pem
  FELIX_TLS_KEY: /var/lib/felix/broker-key.pem
  RUST_LOG: info

# How felixd and felixctl reach Felix from inside the network. The brokers'
# certificate names `localhost`. felixd takes IP addresses, not host names.
x-client-env: &client-env
  FELIX_BROKERS: 172.29.0.11:5000,172.29.0.12:5000,172.29.0.13:5000
  FELIX_SERVER_NAME: localhost
  FELIX_AUTH_TENANT: dev
  FELIX_AUTH_TOKEN_FILE: /var/lib/felix/client.jwt
  FELIX_CA_FILE: /var/lib/felix/ca.pem
  FELIX_CONTROLPLANE_URL: http://felix-controlplane:8443
  FELIX_CONTROLPLANE_TOKEN_FILE: /var/lib/felix/controlplane.jwt
  NO_COLOR: "1"

x-felixd: &felixd
  image: localhost/felixd:local
  environment: *client-env
  networks: [felix]
  volumes:
    - felix-dev:/var/lib/felix:ro
  restart: "no"
  depends_on:
    felix-fleet:
      condition: service_completed_successfully

services:
  felix-controlplane:
    image: ghcr.io/getfelix/felix-controlplane:${FELIX_VERSION:-0.6.2}
    environment:
      FELIX_CONTROLPLANE_STORAGE_BACKEND: memory
      # Dev tokens let the bootstrap token mint a token for any principal. The
      # control plane refuses them unless bootstrap listens on loopback, and
      # nothing publishes 9095, so only felix-dev-auth (which shares this
      # container's network namespace) can reach it.
      FELIX_BOOTSTRAP_ENABLED: "true"
      FELIX_BOOTSTRAP_BIND_ADDR: 127.0.0.1:9095
      FELIX_BOOTSTRAP_TOKEN: felix-dev-only-bootstrap-token
      FELIX_BOOTSTRAP_DEV_TOKENS: "true"
      FELIX_EXCHANGE_TOKEN_TTL_SECONDS: "86400"
      RUST_LOG: info
    networks: [felix]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Initializes tenant `dev` and namespace `default`, and writes the brokers',
  # felixd's and felixctl's tokens and the brokers' certificate to the
  # felix-dev volume.
  felix-dev-auth:
    image: ghcr.io/getfelix/felix-controlplane:${FELIX_VERSION:-0.6.2}
    network_mode: "service:felix-controlplane"
    depends_on:
      felix-controlplane:
        condition: service_healthy
    volumes:
      - felix-dev:/var/lib/felix
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        BT=felix-dev-only-bootstrap-token
        BOOT=http://127.0.0.1:9095/internal/bootstrap/tenants/dev
        CP=http://127.0.0.1:8443/v1/tenants/dev
        OUT=/var/lib/felix

        # POST $$2 to $$1 with header $$3. Sets $$status; the body is in /tmp/body.
        post() {
          status=$$(wget -q -S --content-on-error -O /tmp/body \
            --header 'Content-Type: application/json' --header "$$3" \
            --post-data "$$2" "$$1" 2>&1 \
            | sed -n 's/^ *HTTP\/[0-9.]* \([0-9]*\).*/\1/p' | tail -n 1)
        }
        field() { sed -n "s/.*\"$$1\":\"\([^\"]*\)\".*/\1/p" /tmp/body; }
        fail() { echo "felix-dev-auth: $$1 (HTTP $${status:-none})"; cat /tmp/body 2>/dev/null; exit 1; }

        # 409 is a tenant this control plane already initialized.
        for _ in $$(seq 1 30); do
          post "$$BOOT/initialize" '{"display_name":"dev","idp_issuers":[],
            "initial_admin_principals":["p:admin"],
            "policies":[
              {"subject":"role:broker","object":"cluster:*","action":"node.view"},
              {"subject":"role:broker","object":"cluster:*","action":"node.manage"},
              {"subject":"role:dev","object":"namespace:dev/*","action":"ns.manage"}],
            "groupings":[{"user":"p:broker","role":"role:broker"},{"user":"p:dev","role":"role:dev"}]}' \
            "X-Felix-Bootstrap-Token: $$BT"
          [ -n "$$status" ] && break
          sleep 1
        done
        case "$$status" in 200|409) ;; *) fail "initializing tenant dev failed" ;; esac

        mint() {
          post "$$BOOT/dev-token" "$$1" "X-Felix-Bootstrap-Token: $$BT"
          [ "$$status" = 200 ] && [ -n "$$(field felix_token)" ] || fail "minting a token failed"
        }
        umask 077
        # One token per broker: a refresh token is rotated when it is used.
        for n in 1 2 3; do
          mkdir -p $$OUT/data-$$n
          mint '{"principal":"p:broker","audience":"felix-controlplane"}'
          field felix_token > "$$OUT/node-$$n.jwt"
          field refresh_token > "$$OUT/node-$$n-refresh.jwt"
        done
        # One certificate for every broker, so a restarted broker is still
        # trusted. Clients trust ca.pem.
        ec="-newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes"
        [ -f "$$OUT/ca.pem" ] || {
        openssl req -x509 $$ec -subj /CN=felixd-dev-ca -days 30 \
          -keyout /tmp/ca-key.pem -out "$$OUT/ca.pem" 2>/dev/null
        openssl req $$ec -subj /CN=localhost -keyout "$$OUT/broker-key.pem" \
          -out /tmp/broker.csr 2>/dev/null
        printf 'subjectAltName=DNS:localhost\nbasicConstraints=CA:FALSE\n' > /tmp/ext
        openssl x509 -req -in /tmp/broker.csr -CA "$$OUT/ca.pem" -CAkey /tmp/ca-key.pem \
          -CAcreateserial -days 30 -extfile /tmp/ext -out "$$OUT/broker-cert.pem" 2>/dev/null
        }
        # For finalizing fleet features.
        mint '{"principal":"p:broker","audience":"felix-controlplane"}'
        field felix_token > "$$OUT/operator.jwt"
        umask 022
        mint '{"principal":"p:dev","audience":"felix-controlplane","requested":["ns.manage","stream.manage","cache.manage"]}'
        field felix_token > "$$OUT/controlplane.jwt"
        mint '{"principal":"p:dev","audience":"felix-broker","requested":["stream.publish","stream.subscribe","stream.manage","cache.read","cache.write"]}'
        field felix_token > "$$OUT/client.jwt"

        admin="Authorization: Bearer $$(cat "$$OUT/controlplane.jwt")"
        post "$$CP/namespaces" '{"namespace":"default","display_name":"default"}' "$$admin"
        case "$$status" in 2??|409) ;; *) fail "creating namespace default failed" ;; esac
        echo "felix-dev-auth: tenant dev and namespace default created; tokens written"

  broker-1:
    <<: *broker
    environment:
      <<: *broker-env
      FELIX_NODE_ID: broker-1
      FELIX_NODE_ADVERTISE_ADDR: 172.29.0.11:5001
      FELIX_CLIENT_ADVERTISE_ADDR: 172.29.0.11:5000
      FELIX_NODE_TOKEN_FILE: /var/lib/felix/node-1.jwt
      FELIX_NODE_REFRESH_TOKEN_FILE: /var/lib/felix/node-1-refresh.jwt
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix/data-1
    networks:
      felix:
        ipv4_address: 172.29.0.11

  broker-2:
    <<: *broker
    environment:
      <<: *broker-env
      FELIX_NODE_ID: broker-2
      FELIX_NODE_ADVERTISE_ADDR: 172.29.0.12:5001
      FELIX_CLIENT_ADVERTISE_ADDR: 172.29.0.12:5000
      FELIX_NODE_TOKEN_FILE: /var/lib/felix/node-2.jwt
      FELIX_NODE_REFRESH_TOKEN_FILE: /var/lib/felix/node-2-refresh.jwt
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix/data-2
    networks:
      felix:
        ipv4_address: 172.29.0.12

  broker-3:
    <<: *broker
    environment:
      <<: *broker-env
      FELIX_NODE_ID: broker-3
      FELIX_NODE_ADVERTISE_ADDR: 172.29.0.13:5001
      FELIX_CLIENT_ADVERTISE_ADDR: 172.29.0.13:5000
      FELIX_NODE_TOKEN_FILE: /var/lib/felix/node-3.jwt
      FELIX_NODE_REFRESH_TOKEN_FILE: /var/lib/felix/node-3-refresh.jwt
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix/data-3
    networks:
      felix:
        ipv4_address: 172.29.0.13

  # Turns on what failover of Quorum streams and caches needs, then creates
  # the example input stream `in` with three replicas.
  felix-fleet:
    image: ghcr.io/getfelix/felix-controlplane:${FELIX_VERSION:-0.6.2}
    network_mode: "service:felix-controlplane"
    depends_on:
      broker-1: {condition: service_healthy}
      broker-2: {condition: service_healthy}
      broker-3: {condition: service_healthy}
    volumes:
      - felix-dev:/var/lib/felix
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        auth="Authorization: Bearer $$(cat /var/lib/felix/operator.jwt)"
        for feature in generation_start majority_ack lease_free_reads fenced_caches; do
          ok=
          for _ in $$(seq 1 30); do
            if wget -q -O /tmp/body --header "$$auth" --post-data '' \
              "http://127.0.0.1:8443/v1/fleet/features/$$feature/finalize"; then
              ok=1; break
            fi
            sleep 1
          done
          [ -n "$$ok" ] || { echo "felix-fleet: finalizing $$feature failed"; exit 1; }
        done
        sleep 3
        admin="Authorization: Bearer $$(cat /var/lib/felix/controlplane.jwt)"
        streams=http://127.0.0.1:8443/v1/tenants/dev/namespaces/default/streams
        # A rerun finds the stream already there.
        wget -q -O /tmp/body --header "$$admin" "$$streams/in" 2>/dev/null || \
        wget -q -O /tmp/body --header "$$admin" --header 'Content-Type: application/json' \
          --post-data '{"stream":"in","kind":"Stream","shards":1,"replication_factor":3,
            "retention":{"max_age_seconds":null,"max_size_bytes":null},
            "consistency":"Quorum","delivery":"AtLeastOnce","durable":true}' "$$streams" \
          || { echo "felix-fleet: creating stream in failed"; exit 1; }
        echo "felix-fleet: features finalized, stream in created"

  felixd-1:
    <<: *felixd
    build:
      context: ..
      dockerfile: deploy/felixd.Dockerfile
    container_name: felixd-node-1
    command: ["agent", "--node-id", "node-1", "--lease-ttl-ms", "4000"]

  felixd-2:
    <<: *felixd
    container_name: felixd-node-2
    command: ["agent", "--node-id", "node-2", "--lease-ttl-ms", "4000"]

  felixd-3:
    <<: *felixd
    container_name: felixd-node-3
    command: ["agent", "--node-id", "node-3", "--lease-ttl-ms", "4000"]

  # `docker compose run --rm felixd <args>` runs the felixd CLI in the stack:
  # run, check, replay.
  felixd:
    <<: *felixd
    profiles: ["cli"]

  # Publishes a numbered record to `in` ten times a second. Start it with
  # `docker compose --profile producer up -d producer`.
  producer:
    image: ghcr.io/getfelix/felixctl:${FELIX_VERSION:-0.6.2}
    profiles: ["producer"]
    environment: *client-env
    networks: [felix]
    volumes:
      - felix-dev:/var/lib/felix:ro
    depends_on:
      felix-fleet:
        condition: service_completed_successfully
    # A quorum stream just created refuses publishes for a moment, so retry.
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        while :; do i=$$((i + 1)); echo "$$i"; sleep 0.1; done | felixctl pub in

networks:
  felix:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  felix-dev:
