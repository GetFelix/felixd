name: Scale

# How many workloads one Felix cluster carries: create time, memory and
# failover time with N workloads on three brokers and three agents. Run it by
# hand from the Actions tab or with `gh workflow run scale.yml`; scale-nightly.yml
# also runs it at 1000 workloads against Felix main every night.
# CONTRIBUTING.md's "Running the scale test" says how to read the result.
on:
  workflow_call:
    inputs:
      counts:
        type: string
        default: "100,500,1000,10000"
      build_secs:
        type: string
        default: "1200"
      failover_secs:
        type: string
        default: "300"
      timeout_minutes:
        type: string
        default: "300"
      felix_image_tag:
        description: "Felix image tag to run; empty runs the release in .felix-version"
        type: string
        default: ""
      election:
        description: "on makes the brokers elect leaders without the control plane; off leaves them as before"
        type: string
        default: "off"
      cp_down:
        description: "true runs the broker kill with the control plane paused; needs election on"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      counts:
        description: "Workload counts to measure, comma separated, smallest first. COUNT:SECONDS also sets the lease TTL"
        default: "100,500,1000,10000"
      build_secs:
        description: How long creating and starting the workloads may take
        default: "1200"
      failover_secs:
        description: How long first output and each failover may take
        default: "300"
      timeout_minutes:
        description: Whole job timeout
        default: "300"
      felix_image_tag:
        description: "Felix image tag to run, such as nightly; empty runs the release in .felix-version"
        default: ""
      election:
        description: "Replica election: on starts brokers with FELIX_INTERNAL_ELECTION=true and finalizes joint_fence and replica_election"
        type: choice
        options: ["off", "on"]
        default: "off"
      cp_down:
        description: "Kill the broker leading the most shards while the control plane is paused (needs election on), then restart it, then resume the control plane"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '300') }}
    env:
      COUNTS: ${{ inputs.counts || '100,500,1000,10000' }}
      BUILD_SECS: ${{ inputs.build_secs || '1200' }}
      FAILOVER_SECS: ${{ inputs.failover_secs || '300' }}
      FELIX_IMAGE_TAG: ${{ inputs.felix_image_tag }}
      ELECTION: ${{ inputs.election || 'off' }}
      CP_DOWN: ${{ inputs.cp_down && 'true' || 'false' }}
      RUST_LOG: warn
      FELIXD_REQUIRE_FELIX: "1"
      FELIX_BROKERS: 127.0.0.1:5100,127.0.0.1:5200,127.0.0.1:5300
      FELIX_AUTH_TENANT: dev
      FELIX_AUTH_TOKEN_FILE: /tmp/felix/client.jwt
      FELIX_CA_FILE: /tmp/felix/broker-cert.pem
      FELIX_CONTROLPLANE_URL: http://127.0.0.1:8443
      FELIX_CONTROLPLANE_TOKEN_FILE: /tmp/felix/controlplane.jwt
      FELIX_OPERATOR_TOKEN_FILE: /tmp/felix/operator.jwt
    steps:
      - name: Free runner disk
        run: |
          # The runner image ships about 14 GB of toolchains this job never
          # uses; the brokers' data, container logs and image layers need it.
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Runner
        run: |
          mkdir -p results
          {
            echo "cpus: $(nproc)"
            free -m | sed -n 2p | awk '{print "memory_mb: " $2}'
            df -Pm / | sed -n 2p | awk '{print "disk_mb: " $2 " total, " $4 " free"}'
            docker --version
          } | tee results/runner.txt
      - name: Build the test
        run: cargo test -p felixd --test scale --locked --no-run
      - name: Measure
        run: |
          export FELIX_VERSION=${FELIX_IMAGE_TAG:-$(sed -n 's/^version=//p' .felix-version)}
          echo "felix images: $FELIX_VERSION" | tee -a results/runner.txt
          # Read by cluster.yaml: the brokers' FELIX_INTERNAL_ELECTION and the
          # fleet features felix-fleet finalizes. Off leaves both unset.
          case $ELECTION in
            on) export FELIXD_ELECTION=true ;;
            off) ;;
            *) echo "::error::election must be on or off, not $ELECTION"; exit 1 ;;
          esac
          echo "election: $ELECTION" | tee -a results/runner.txt
          if [ "$CP_DOWN" = true ] && [ "$ELECTION" != on ]; then
            echo "::error::cp_down needs election on"; exit 1
          fi
          echo "cp_down: $CP_DOWN" | tee -a results/runner.txt
          # Three more phases, and the test waits 30 s for the brokers to notice.
          extra=0
          [ "$CP_DOWN" = true ] && extra=$((FAILOVER_SECS * 3 + 60))
          cluster=tests/felix/cluster.yaml
          failed=0
          first=1
          for spec in ${COUNTS//,/ }; do
            n=${spec%%:*}
            ttl=10
            case $spec in *:*) ttl=${spec##*:} ;; esac
            echo "::group::$n workloads, lease TTL ${ttl}s"
            # A fresh cluster for each count, so one run's streams do not
            # weigh on the next.
            docker compose -f $cluster down -v --remove-orphans
            docker compose -f $cluster up -d --wait broker-1 broker-2 broker-3
            docker compose -f $cluster run --rm felix-fleet
            tests/felix/credentials.sh /tmp/felix cluster
            if FELIXD_SCALE_COUNT=$n FELIXD_SCALE_OUT=$PWD/results \
              FELIXD_SCALE_LEASE_TTL_SECS=$ttl FELIXD_SCALE_TIMEOUT_SECS=$BUILD_SECS \
              FELIXD_SCALE_FAILOVER_SECS=$FAILOVER_SECS FELIXD_SCALE_CP_DOWN=$CP_DOWN FELIXD_CLUSTER=$PWD/$cluster \
              timeout -k 30 $((BUILD_SECS + FAILOVER_SECS * 6 + 600 + extra)) \
              cargo test -p felixd --test scale --locked -- --nocapture \
              > results/test-$n-ttl$ttl.log 2>&1; then
              ok=1
            else
              ok=0
              failed=1
            fi
            pkill -f 'felixd agent' || true
            # The agents write into the test log; keep the step log small
            # and the artifact bounded.
            tail -n 200 results/test-$n-ttl$ttl.log
            ls -l results/test-$n-ttl$ttl.log
            tail -c 20000000 results/test-$n-ttl$ttl.log > results/test.tmp
            mv results/test.tmp results/test-$n-ttl$ttl.log
            df -h / | tail -1
            sudo du -sh /var/lib/docker/containers/*/*-json.log 2>/dev/null | sort -rh | head -5
            docker ps -a --format '{{.Names}}  {{.Status}}' > results/containers-$n-ttl$ttl.txt
            # Whole logs, not a tail: a stuck shard is traced from the start
            # of the run, as far back as the cap reaches. The compose file caps each container's json log.
            for b in broker-1 broker-2 broker-3 felix-controlplane; do
              name=$b
              [ $b = felix-controlplane ] && name=controlplane
              (set -o pipefail; docker compose -f $cluster logs --no-color $b 2>&1 | gzip > results/log-$n-ttl$ttl-$name.txt.gz) || echo "::warning::could not dump $b logs"
            done
            ls -l results/log-$n-ttl$ttl-*.txt.gz
            echo "::endgroup::"
            # The smallest count not settling means a broken harness or
            # cluster, so do not spend hours on the larger ones. Phases that
            # fail are notes, not test failures, so read the result.
            if [ $first = 1 ]; then
              reached=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["running"]["reached"])' \
                results/scale-$n-ttl$ttl.json 2>/dev/null || echo False)
              if [ $ok = 0 ] || [ "$reached" != True ]; then
                echo "::error::$n workloads did not all start; stopping"
                failed=1
                break
              fi
            fi
            first=0
          done
          exit $failed
      - name: Summary
        if: always()
        run: |
          {
            echo "### Scale test"
            echo
            echo '```'; cat results/runner.txt; echo '```'
            echo
            echo "| Workloads | Lease TTL | Streams | Create | All running | Broker memory | Control plane memory | First output | Agent failover | Broker failover | Leaders moved | CP-down failover | CP-down leaders moved | CP-down restart | CP back |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
            cat results/scale-*.row.md 2>/dev/null
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-results
          path: results/
          retention-days: 7
