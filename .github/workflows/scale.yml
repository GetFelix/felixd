name: Scale

# How many workloads one Felix cluster carries: create time, memory and
# failover time with N workloads on three brokers and three agents. Run it by
# hand from the Actions tab or with `gh workflow run scale.yml`. It never runs
# on its own. The README's "Running the scale test" says how to read the result.
on:
  workflow_dispatch:
    inputs:
      counts:
        description: "Workload counts to measure, comma separated, smallest first. COUNT:SECONDS also sets the lease TTL"
        default: "100,500,1000,10000"
      build_secs:
        description: How long creating and starting the workloads may take
        default: "1200"
      failover_secs:
        description: How long first output and each failover may take
        default: "300"
      timeout_minutes:
        description: Whole job timeout
        default: "300"
  # Temporary, so the branch can be measured before it reaches main.
  push:
    branches: [feat/20-scale]
    paths:
      - .github/workflows/scale.yml
      - crates/felixd/tests/scale.rs

env:
  CARGO_TERM_COLOR: always

jobs:
  # felix#1760 bisect: build the broker and control plane images once from the
  # Felix commit in .felix-build, then measure them in three replicas.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Felix commit
        id: sha
        run: echo "sha=$(tr -d '[:space:]' < .felix-build)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: GetFelix/felix
          ref: ${{ steps.sha.outputs.sha }}
          path: felix-src
      - name: Patch
        run: if [ -f .felix-patch ]; then git -C felix-src apply --verbose ../.felix-patch; fi
      - name: Build images
        run: |
          cd felix-src
          docker build -f docker/broker.Dockerfile -t ghcr.io/getfelix/felix-broker:bisect .
          docker build -f docker/controlplane.Dockerfile -t ghcr.io/getfelix/felix-controlplane:bisect .
          docker save ghcr.io/getfelix/felix-broker:bisect ghcr.io/getfelix/felix-controlplane:bisect | gzip > ../images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 3

  scale:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '300') }}
    env:
      COUNTS: ${{ inputs.counts || '100,250,500,1000,1000:30,10000' }}
      BUILD_SECS: ${{ inputs.build_secs || '1200' }}
      FAILOVER_SECS: ${{ inputs.failover_secs || '300' }}
      RUST_LOG: warn
      FELIXD_REQUIRE_FELIX: "1"
      FELIX_BROKERS: 127.0.0.1:5100,127.0.0.1:5200,127.0.0.1:5300
      FELIX_AUTH_TENANT: dev
      FELIX_AUTH_TOKEN_FILE: /tmp/felix/client.jwt
      FELIX_CA_FILE: /tmp/felix/broker-cert.pem
      FELIX_CONTROLPLANE_URL: http://127.0.0.1:8443
      FELIX_CONTROLPLANE_TOKEN_FILE: /tmp/felix/controlplane.jwt
      FELIX_OPERATOR_TOKEN_FILE: /tmp/felix/operator.jwt
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: images
      - name: Load images
        run: gunzip -c images.tar.gz | docker load && rm images.tar.gz
      - name: Runner
        run: |
          mkdir -p results
          {
            echo "cpus: $(nproc)"
            free -m | sed -n 2p | awk '{print "memory_mb: " $2}'
            df -Pm / | sed -n 2p | awk '{print "disk_mb: " $2 " total, " $4 " free"}'
            docker --version
          } | tee results/runner.txt
      - name: Build the test
        run: cargo test -p felixd --test scale --locked --no-run
      - name: Measure
        run: |
          export FELIX_VERSION=bisect
          cluster=tests/felix/cluster.yaml
          failed=0
          first=1
          for spec in ${COUNTS//,/ }; do
            n=${spec%%:*}
            ttl=10
            case $spec in *:*) ttl=${spec##*:} ;; esac
            echo "::group::$n workloads, lease TTL ${ttl}s"
            # A fresh cluster for each count, so one run's streams do not
            # weigh on the next.
            docker compose -f $cluster down -v --remove-orphans
            docker compose -f $cluster up -d --wait broker-1 broker-2 broker-3
            docker compose -f $cluster run --rm felix-fleet
            tests/felix/credentials.sh /tmp/felix cluster
            if FELIXD_SCALE_COUNT=$n FELIXD_SCALE_OUT=$PWD/results \
              FELIXD_SCALE_LEASE_TTL_SECS=$ttl FELIXD_SCALE_TIMEOUT_SECS=$BUILD_SECS \
              FELIXD_SCALE_FAILOVER_SECS=$FAILOVER_SECS FELIXD_CLUSTER=$PWD/$cluster \
              perl -e 'alarm shift; exec @ARGV' $((BUILD_SECS + FAILOVER_SECS * 6 + 600)) \
              cargo test -p felixd --test scale --locked -- --nocapture; then
              ok=1
            else
              ok=0
              failed=1
            fi
            pkill -f 'felixd agent' || true
            docker ps -a --format '{{.Names}}  {{.Status}}' > results/containers-$n-ttl$ttl.txt
            for b in broker-1 broker-2 broker-3; do
              docker compose -f $cluster logs --no-color --timestamps $b 2>&1 | gzip > results/log-$n-ttl$ttl-$b.txt.gz
            done
            docker compose -f $cluster logs --no-color felix-controlplane > results/log-$n-ttl$ttl-controlplane.txt 2>&1
            echo "::endgroup::"
            # A failure at the smallest count is a broken harness or cluster.
            if [ $ok = 0 ] && [ $first = 1 ]; then break; fi
            first=0
          done
          exit $failed
      - name: Summary
        if: always()
        run: |
          {
            echo "### Scale test"
            echo
            echo '```'; cat results/runner.txt; echo '```'
            echo
            echo "| Workloads | Lease TTL | Streams | Create | All running | Broker memory | Control plane memory | First output | Agent failover | Broker failover | Leaders moved |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|"
            cat results/scale-*.row.md 2>/dev/null
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-results-${{ matrix.rep }}
          path: results/
