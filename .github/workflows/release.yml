name: Release

# A v* tag builds felixd for three targets, checks each build is reproducible,
# signs the checksums and publishes a release. Run by hand (workflow_dispatch)
# it (or a pull request touching this file) does everything except publish, and keeps the files as workflow artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # Changes to the release machinery rehearse themselves.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-build.sh
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Only the tag or branch name; the commit time is what dates the build.
  RELEASE_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('dryrun-{0}', github.run_id) }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # rust-toolchain.toml pins 1.97.1; the exact version here must match it.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.97.1"

      - name: Build twice and compare
        id: build
        run: |
          set -euo pipefail
          name="felixd-${RELEASE_NAME}-${{ matrix.target }}"
          first=$(scripts/release-build.sh "$name" dist)
          # A second build from a different path and a later clock must match.
          sleep 2
          second=$(scripts/release-build.sh "$name" dist-second)
          echo "first:  $first"
          echo "second: $second"
          [ "$first" = "$second" ] || { echo "::error::binary is not reproducible"; exit 1; }
          cmp "dist/$name.tar.gz" "dist-second/$name.tar.gz" \
            || { echo "::error::archive is not reproducible"; exit 1; }
          rm -rf dist-second
          echo "binary_sha256=$first" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: felixd-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # A fresh runner and a fresh checkout build the Linux binary a third time,
  # so "reproducible" does not rest on one machine's state.
  reproduce:
    name: Rebuild on a clean runner
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.97.1"

      - name: Download the first build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: felixd-x86_64-unknown-linux-gnu
          path: first

      - name: Compare
        run: |
          set -euo pipefail
          name="felixd-${RELEASE_NAME}-x86_64-unknown-linux-gnu"
          scripts/release-build.sh "$name" rebuilt
          cmp "first/$name.tar.gz" "rebuilt/$name.tar.gz"
          sha256sum first/*.tar.gz rebuilt/*.tar.gz

  sign:
    name: Checksums and signature
    needs: [build, reproduce]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: felixd-*
          path: dist
          merge-multiple: true

      - name: Checksum
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the certificate names this workflow run, recorded in the
      # public Rekor log. No key to guard or rotate.
      - name: Sign checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Verify the signature
        working-directory: dist
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish release
    # A dry run stops at the artifacts above.
    if: github.event_name == 'push'
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
