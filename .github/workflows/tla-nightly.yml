name: TLA nightly

# FelixdFull, FelixdSpecsFull and FelixdMergeFull are too large to check every state, so this
# walks random behaviours of them instead. The pull request suite checks the
# smaller configurations exhaustively.
#
# One job per configuration: run back to back in one job, the three together outlast any
# sensible job timeout and the later ones never ran.
on:
  schedule:
    - cron: "43 8 * * *"
  workflow_dispatch:
    inputs:
      traces:
        description: How many behaviours to walk
        default: "3000000"

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: Felixd, config: FelixdFull }
          - { module: FelixdSpecs, config: FelixdSpecsFull }
          - { module: FelixdMerge, config: FelixdMergeFull }
    name: simulate ${{ matrix.config }}
    env:
      TLC_SIMULATE: ${{ inputs.traces || '3000000' }}
      TLC_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: TLA_MODULE=${{ matrix.module }} scripts/check_tla.sh ${{ matrix.config }}
