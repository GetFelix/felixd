name: TLA nightly

# FelixdFull, FelixdSpecsFull, FelixdMergeFull and FelixdPlacementFull are too large to check every state, so this
# walks random behaviours of them instead. The pull request suite checks the
# smaller configurations exhaustively.
#
# One job per configuration: run back to back in one job, the three together outlast any
# sensible job timeout and the later ones never ran.
on:
  schedule:
    - cron: "43 8 * * *"
  workflow_dispatch:
    inputs:
      traces:
        description: How many behaviours to walk
        default: "3000000"
      config:
        description: Walk only this configuration (empty walks all)
        default: ""

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # traces: empty walks the default; FelixdMergeFull walks fewer because
          # it did not finish the default within the timeout.
          - { module: Felixd, config: FelixdFull, traces: "" }
          - { module: FelixdSpecs, config: FelixdSpecsFull, traces: "" }
          - { module: FelixdMerge, config: FelixdMergeFull, traces: "750000" }
          - { module: FelixdPlacement, config: FelixdPlacementFull, traces: "" }
    name: simulate ${{ matrix.config }}
    env:
      TLC_SIMULATE: ${{ inputs.traces || matrix.traces || '3000000' }}
      TLC_WORKERS: "4"
    steps:
      - if: inputs.config == '' || inputs.config == matrix.config
        uses: actions/checkout@v4
      - if: inputs.config == '' || inputs.config == matrix.config
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: inputs.config == '' || inputs.config == matrix.config
        run: TLA_MODULE=${{ matrix.module }} scripts/check_tla.sh ${{ matrix.config }}
