name: TLA nightly

# FelixdFull, FelixdSpecsFull and FelixdMergeFull are too large to check every state, so this
# walks random behaviours of them instead. The pull request suite checks the
# smaller configurations exhaustively.
on:
  schedule:
    - cron: "43 8 * * *"
  workflow_dispatch:
    inputs:
      traces:
        description: How many behaviours to walk
        default: "3000000"

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TLC_SIMULATE: ${{ inputs.traces || '3000000' }}
      TLC_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: scripts/check_tla.sh FelixdFull
      - if: ${{ !cancelled() }}
        run: TLA_MODULE=FelixdSpecs scripts/check_tla.sh FelixdSpecsFull
      - if: ${{ !cancelled() }}
        run: TLA_MODULE=FelixdMerge scripts/check_tla.sh FelixdMergeFull
