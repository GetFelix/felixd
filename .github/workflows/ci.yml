name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path workloads/Cargo.toml --all --check
      - run: cargo clippy --manifest-path workloads/Cargo.toml --all-targets --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --bins --locked
      - run: scripts/check-no-faults.sh
      - run: scripts/check-no-faults.sh release

  integration:
    runs-on: ubuntu-latest
    env:
      FELIXD_REQUIRE_FELIX: "1"
      FELIX_BROKERS: 127.0.0.1:5000
      FELIX_AUTH_TENANT: dev
      FELIX_AUTH_TOKEN_FILE: /tmp/felix/client.jwt
      FELIX_CA_FILE: /tmp/felix/broker-cert.pem
      FELIX_CONTROLPLANE_URL: http://127.0.0.1:8443
      FELIX_CONTROLPLANE_TOKEN_FILE: /tmp/felix/controlplane.jwt
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Start Felix
        run: |
          docker compose -f tests/felix/compose.yaml up -d --wait
          tests/felix/credentials.sh /tmp/felix
      - run: cargo test -p felixd --test operator --locked a_recreated_upstream -- --test-threads=1
      - name: Felix logs
        if: failure()
        run: docker compose -f tests/felix/compose.yaml logs --no-color

  # Three brokers and three-replica Quorum streams, so failover and Felix's
  # generation-start records are exercised.
  cluster:
    runs-on: ubuntu-latest
    env:
      FELIXD_REQUIRE_FELIX: "1"
      FELIXD_CLUSTER: tests/felix/cluster.yaml
      FELIX_BROKERS: 127.0.0.1:5100,127.0.0.1:5200,127.0.0.1:5300
      FELIX_AUTH_TENANT: dev
      FELIX_AUTH_TOKEN_FILE: /tmp/felix/client.jwt
      FELIX_CA_FILE: /tmp/felix/broker-cert.pem
      FELIX_CONTROLPLANE_URL: http://127.0.0.1:8443
      FELIX_CONTROLPLANE_TOKEN_FILE: /tmp/felix/controlplane.jwt
      FELIX_OPERATOR_TOKEN_FILE: /tmp/felix/operator.jwt
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Start Felix
        run: |
          docker compose -f tests/felix/cluster.yaml up -d --wait broker-1 broker-2 broker-3
          docker compose -f tests/felix/cluster.yaml run --rm felix-fleet
          tests/felix/credentials.sh /tmp/felix cluster
      - run: FELIXD_CLUSTER=$PWD/$FELIXD_CLUSTER cargo test -p felixd --test cluster --test fence --test batches --test answers --test pipeline --locked -- --test-threads=1
      - name: Felix logs
        if: failure()
        run: docker compose -f tests/felix/cluster.yaml logs --no-color

  # The deploy/compose.yaml stack: three brokers, a control plane and three
  # felixd containers. Kills the node holding a workload and checks that
  # another takes it over without gaps or repeats. Runs under Docker and under
  # rootless Podman (podman compose with the docker-compose provider).
  compose:
    name: compose (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      ENGINE: ${{ matrix.engine }}
      PODMAN_COMPOSE_PROVIDER: docker-compose
    steps:
      - uses: actions/checkout@v4
      - name: Podman API socket
        if: matrix.engine == 'podman'
        run: |
          podman --version
          # podman compose looks for a standalone docker-compose; the runner
          # only has Docker's plugin build of it.
          plugin=$(ls /usr/libexec/docker/cli-plugins/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose 2>/dev/null | head -n 1)
          mkdir -p "$HOME/.local/bin"
          ln -sf "$plugin" "$HOME/.local/bin/docker-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/docker-compose" version
          systemctl --user enable --now podman.socket
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> "$GITHUB_ENV"
      - run: scripts/compose-failover.sh
      - name: Logs
        if: failure()
        run: $ENGINE compose -f deploy/compose.yaml --profile producer --profile cli logs --no-color

  # specs/Felixd.tla under every configuration in scripts/check_tla.sh: the
  # passing ones must pass and each twin must find its violation.
  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: TLC_WORKERS=4 scripts/check_tla.sh

  # specs/FelixdSpecs.tla, the spec history model, in its own job so the
  # Felixd configurations keep the whole 30 minutes.
  tla-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: TLA_MODULE=FelixdSpecs TLC_WORKERS=4 scripts/check_tla.sh
