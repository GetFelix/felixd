name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a PR cancels its older run. Each main commit keeps its own
  # group so back-to-back merges all finish.
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path workloads/Cargo.toml --all --check
      - run: cargo clippy --manifest-path workloads/Cargo.toml --all-targets --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --lib --bins --locked
      - run: scripts/check-no-faults.sh
      - run: scripts/check-no-faults.sh release

  integration:
    runs-on: ubuntu-latest
    env:
      FELIXD_REQUIRE_FELIX: "1"
      FELIX_BROKERS: 127.0.0.1:5000
      FELIX_AUTH_TENANT: dev
      FELIX_AUTH_TOKEN_FILE: /tmp/felix/client.jwt
      FELIX_CA_FILE: /tmp/felix/broker-cert.pem
      FELIX_CONTROLPLANE_URL: http://127.0.0.1:8443
      FELIX_CONTROLPLANE_TOKEN_FILE: /tmp/felix/controlplane.jwt
      FELIXD_RESTRICTED_TOKEN_FILE: /tmp/felix/restricted-node.jwt
      FELIXD_GRANTS_DIR: /tmp/felix
      FELIXD_SECRETS_ADMISSION_TOKEN_FILE: /tmp/felix/admission-client.jwt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Start Felix
        run: |
          docker compose -f tests/felix/compose.yaml up -d --wait
          tests/felix/credentials.sh /tmp/felix
      - run: cargo test --workspace --test '*' --locked -- --test-threads=1
      - name: Felix logs
        if: failure()
        run: docker compose -f tests/felix/compose.yaml logs --no-color

  # Three brokers and three-replica Quorum streams, so failover and Felix's
  # generation-start records are exercised.
  cluster:
    runs-on: ubuntu-latest
    env:
      FELIXD_REQUIRE_FELIX: "1"
      FELIXD_CLUSTER: tests/felix/cluster.yaml
      FELIX_BROKERS: 127.0.0.1:5100,127.0.0.1:5200,127.0.0.1:5300
      FELIX_AUTH_TENANT: dev
      FELIX_AUTH_TOKEN_FILE: /tmp/felix/client.jwt
      FELIX_CA_FILE: /tmp/felix/broker-cert.pem
      FELIX_CONTROLPLANE_URL: http://127.0.0.1:8443
      FELIX_CONTROLPLANE_TOKEN_FILE: /tmp/felix/controlplane.jwt
      FELIX_OPERATOR_TOKEN_FILE: /tmp/felix/operator.jwt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Start Felix
        run: |
          docker compose -f tests/felix/cluster.yaml up -d --wait broker-1 broker-2 broker-3
          docker compose -f tests/felix/cluster.yaml run --rm felix-fleet
          tests/felix/credentials.sh /tmp/felix cluster
      - run: FELIXD_CLUSTER=$PWD/$FELIXD_CLUSTER cargo test -p felixd --test cluster --test fence --test batches --test answers --test pipeline --test merge --test retention --test drain --test admission --locked -- --test-threads=1
      - name: Felix logs
        if: failure()
        run: docker compose -f tests/felix/cluster.yaml logs --no-color

  # The deploy/compose.yaml stack: three brokers, a control plane and three
  # felixd containers. Kills the node holding a workload and checks that
  # another takes it over without gaps or repeats. Runs under Docker and under
  # rootless Podman (podman compose with the docker-compose provider).
  compose:
    name: compose (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      ENGINE: ${{ matrix.engine }}
      PODMAN_COMPOSE_PROVIDER: docker-compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Podman API socket
        if: matrix.engine == 'podman'
        run: |
          podman --version
          # podman compose looks for a standalone docker-compose; the runner
          # only has Docker's plugin build of it.
          plugin=$(ls /usr/libexec/docker/cli-plugins/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose 2>/dev/null | head -n 1)
          mkdir -p "$HOME/.local/bin"
          ln -sf "$plugin" "$HOME/.local/bin/docker-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/docker-compose" version
          systemctl --user enable --now podman.socket
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> "$GITHUB_ENV"
      - run: scripts/compose-failover.sh
      - name: Logs
        if: failure()
        run: $ENGINE compose -f deploy/compose.yaml --profile producer --profile cli logs --no-color

  # specs/Felixd.tla under every configuration in scripts/check_tla.sh: the
  # passing ones must pass and each twin must find its violation.
  tla:
    runs-on: ubuntu-latest
    # The script takes 21 to 30 minutes, depending on the runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: TLC_WORKERS=4 scripts/check_tla.sh

  # specs/Felixd.tla with trimming on, in its own job so it does not add to
  # the tla job's run time.
  tla-trim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: TLA_MODULE=FelixdTrimming TLC_WORKERS=4 scripts/check_tla.sh

  # specs/Felixd.tla with the restart intensity counter on, in its own job.
  tla-intensity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: TLA_MODULE=FelixdIntensity TLC_WORKERS=4 scripts/check_tla.sh

  # specs/FelixdSpecs.tla, the spec history model, in its own job so it does
  # not add to the tla job's run time.
  tla-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: TLA_MODULE=FelixdSpecs TLC_WORKERS=4 scripts/check_tla.sh

  # specs/FelixdMerge.tla, the merge log of a workload with several inputs.
  tla-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: TLA_MODULE=FelixdMerge TLC_WORKERS=4 scripts/check_tla.sh

  # specs/FelixdAdmission.tla, admission's projection and the gate.
  tla-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: TLA_MODULE=FelixdAdmission TLC_WORKERS=4 scripts/check_tla.sh

  # specs/FelixdPlacement.tla, placement groups and the agent's barrier. One leg
  # per pass config, so a slow one cannot keep the twins from running. The
  # crash legs together are FelixdPlacement, which one leg cannot finish; the
  # stamps legs split FelixdPlacementCrashLease with timestamps the same way.
  tla-placement:
    name: tla-placement (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: crash-n1-e1-unplaced, configs: FelixdPlacementCrashN1E1Unplaced }
          - { name: crash-n1-e1-placed, configs: FelixdPlacementCrashN1E1Placed }
          - { name: crash-n1-e2-unplaced, configs: FelixdPlacementCrashN1E2Unplaced }
          - { name: crash-n1-e2-placed, configs: FelixdPlacementCrashN1E2Placed }
          - { name: crash-n2-e1-unplaced, configs: FelixdPlacementCrashN2E1Unplaced }
          - { name: crash-n2-e1-placed, configs: FelixdPlacementCrashN2E1Placed }
          - { name: crash-n2-e2-unplaced, configs: FelixdPlacementCrashN2E2Unplaced }
          - { name: crash-n2-e2-placed, configs: FelixdPlacementCrashN2E2Placed }
          - { name: lease, configs: FelixdPlacementLease }
          - { name: crash-lease, configs: FelixdPlacementCrashLease }
          - { name: silent-holder, configs: FelixdPlacementSilentHolder }
          - { name: restart-lag, configs: FelixdPlacementRestartLag }
          - { name: undrain-n1-unplaced, configs: FelixdPlacementUndrainN1Unplaced }
          - { name: undrain-n1-placed, configs: FelixdPlacementUndrainN1Placed }
          - { name: undrain-n2-unplaced, configs: FelixdPlacementUndrainN2Unplaced }
          - { name: undrain-n2-placed, configs: FelixdPlacementUndrainN2Placed }
          - { name: stamps-n1-unplaced, configs: FelixdPlacementStampsN1Unplaced }
          - { name: stamps-n1-placed, configs: FelixdPlacementStampsN1Placed }
          - { name: stamps-n2-unplaced, configs: FelixdPlacementStampsN2Unplaced }
          - { name: stamps-n2-placed, configs: FelixdPlacementStampsN2Placed }
          - { name: twins, configs: "FelixdPlacementNoBarrier FelixdPlacementNoSplitGuard FelixdPlacementPerMember FelixdPlacementNoFence FelixdPlacementLiveTakers FelixdPlacementNoRecordHold FelixdPlacementNoTailGate FelixdPlacementForgetRestart FelixdPlacementUndrainStale FelixdPlacementUndrainRelist" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: TLA_MODULE=FelixdPlacement TLA_TRACE_DIR=tla-traces TLC_WORKERS=4 scripts/check_tla.sh ${{ matrix.configs }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tla-placement-${{ matrix.name }}
          path: tla-traces/

  # Cheap: python only. Catches a misnamed or empty fragment before the release does.
  changelog:
    name: changelog fragments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/changelog-assemble.py --check
      - run: python3 .github/scripts/test_changelog_assemble.py
